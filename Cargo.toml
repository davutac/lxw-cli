[package]
name = "lxw-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Unofficial, agent-friendly command-line client for the Lexware Office API"
license = "MIT"
publish = false

[[bin]]
name = "lxw"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
miniz_oxide = "0.9.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.0"
strsim = "0.11.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[build-dependencies]
miniz_oxide = "0.9.1"
serde_json = "1.0.151"
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }
