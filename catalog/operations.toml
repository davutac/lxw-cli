# ---------------------------------------------------------------------------
# Articles
# ---------------------------------------------------------------------------

[[operations]]
id = "articles.list"
method = "GET"
path = "/v1/articles"
summary = "List/filter articles (paged)"
docs = "articles-endpoint-filtering-articles"
scopes = ["articles.read"]
max_page_size = 250
keywords = ["search", "find", "filter"]
query = [
  { name = "articleNumber", type = "string", description = "Return the article with this article number." },
  { name = "gtin", type = "string", description = "Return articles with this GTIN/EAN." },
  { name = "type", type = "enum", values = ["PRODUCT", "SERVICE"], description = "Filter by article type." },
]

[[operations]]
id = "articles.get"
method = "GET"
path = "/v1/articles/{id}"
summary = "Retrieve an article"
docs = "articles-endpoint-retrieve-an-article"
scopes = ["articles.read"]

[[operations]]
id = "articles.create"
method = "POST"
path = "/v1/articles"
summary = "Create an article"
docs = "articles-endpoint-create-an-article"
scopes = ["articles.write"]
body = "json"
notes = ["Required: title, type (PRODUCT|SERVICE), unitName, price{leadingPrice (NET|GROSS), taxRate, netPrice or grossPrice}."]

[[operations]]
id = "articles.update"
method = "PUT"
path = "/v1/articles/{id}"
summary = "Update an article (full replace; needs current version)"
docs = "articles-endpoint-update-an-article"
scopes = ["articles.write"]
body = "json"
merge_from = "articles.get"

[[operations]]
id = "articles.delete"
method = "DELETE"
path = "/v1/articles/{id}"
summary = "Delete an article"
docs = "articles-endpoint-delete-an-article"
scopes = ["articles.write"]
response = "empty"
confirm = "Permanently deletes the article."

# ---------------------------------------------------------------------------
# Contacts
# ---------------------------------------------------------------------------

[[operations]]
id = "contacts.list"
method = "GET"
path = "/v1/contacts"
summary = "List/filter contacts by name, email, number or role (paged)"
docs = "contacts-endpoint-filtering-contacts"
scopes = ["contacts.read"]
max_page_size = 250
keywords = ["search", "find", "filter", "customers", "vendors"]
notes = [
  "Filters are ANDed. email and name need at least 3 characters.",
  "email/name support SQL-like wildcards: _ matches one character, % any sequence; escape with \\_ for a literal underscore.",
  "The CLI HTML-escapes &, < and > in email/name as Lexware requires (e.g. 'Johnson & Partner').",
]
query = [
  { name = "email", type = "string", html_encode = true, description = "Match any email address of the contact or its company contact persons (min. 3 chars)." },
  { name = "name", type = "string", html_encode = true, description = "Match the contact name (min. 3 chars)." },
  { name = "number", type = "integer", description = "Customer or vendor number." },
  { name = "customer", type = "boolean", description = "true: only contacts with customer role; false: only without." },
  { name = "vendor", type = "boolean", description = "true: only contacts with vendor role; false: only without." },
]

[[operations]]
id = "contacts.get"
method = "GET"
path = "/v1/contacts/{id}"
summary = "Retrieve a contact"
docs = "contacts-endpoint-retrieve-a-contact"
scopes = ["contacts.read"]

[[operations]]
id = "contacts.create"
method = "POST"
path = "/v1/contacts"
summary = "Create a contact (customer and/or vendor)"
docs = "contacts-endpoint-create-a-contact"
scopes = ["contacts.write"]
body = "json"
notes = [
  "Required: version=0, roles (e.g. {\"customer\":{}}), and either company{name} or person{lastName}.",
  "Addresses need countryCode (ISO 3166 alpha-2). Contacts cannot be deleted via the API.",
]

[[operations]]
id = "contacts.update"
method = "PUT"
path = "/v1/contacts/{id}"
summary = "Update a contact (full replace; needs current version)"
docs = "contacts-endpoint-update-a-contact"
scopes = ["contacts.write"]
body = "json"
merge_from = "contacts.get"

[[operations]]
id = "contact-bank-accounts.list"
method = "GET"
path = "/v1/contacts/{contactId}/bankaccounts"
summary = "List the bank accounts of a contact"
docs = "contacts-endpoint-retrieve-contacts-39-bank-accounts"
scopes = ["contacts.bankaccounts.read"]

[[operations]]
id = "contact-bank-accounts.get"
method = "GET"
path = "/v1/contacts/{contactId}/bankaccounts/{bankAccountId}"
summary = "Retrieve one bank account of a contact"
docs = "contacts-endpoint-retrieve-a-contact-39-s-bank-account"
scopes = ["contacts.bankaccounts.read"]

[[operations]]
id = "contact-bank-accounts.create"
method = "POST"
path = "/v1/contacts/{contactId}/bankaccounts"
summary = "Add a bank account to a contact"
docs = "contacts-endpoint-create-a-contact-39-s-bank-account"
scopes = ["contacts.bankaccounts.write"]
body = "json"
notes = ["Required: accountHolder, bankName, iban, bic."]

[[operations]]
id = "contact-bank-accounts.update"
method = "PUT"
path = "/v1/contacts/{contactId}/bankaccounts/{bankAccountId}"
summary = "Update a bank account of a contact"
docs = "contacts-endpoint-update-a-contact-39-s-bank-account"
scopes = ["contacts.bankaccounts.write"]
body = "json"
merge_from = "contact-bank-accounts.get"
notes = ["version refers to the contact's version and is mandatory."]

[[operations]]
id = "contact-bank-accounts.delete"
method = "DELETE"
path = "/v1/contacts/{contactId}/bankaccounts/{bankAccountId}"
summary = "Delete a bank account of a contact"
docs = "contacts-endpoint-delete-a-contact-39-s-bank-account"
scopes = ["contacts.bankaccounts.write"]
response = "empty"
confirm = "Permanently deletes the contact's bank account."

