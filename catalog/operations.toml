# ---------------------------------------------------------------------------
# Voucher list
# ---------------------------------------------------------------------------

[[operations]]
id = "voucherlist.list"
method = "GET"
path = "/v1/voucherlist"
summary = "Search vouchers of all types by type, status, contact, dates or number (paged)"
docs = "voucherlist-endpoint-retrieve-and-filter-voucherlist"
scopes = ["voucherlist.read"]
max_page_size = 250
sort = ["voucherDate", "voucherNumber", "createdDate", "updatedDate"]
keywords = ["search", "find", "filter", "overdue", "unpaid", "open", "draft", "all invoices", "list invoices", "list quotations"]
notes = [
  "Returns metadata only; fetch details with the endpoint matching voucherType (invoice -> invoices get, salesinvoice/purchaseinvoice -> vouchers get, ...).",
  "At most 10,000 results per query ('Maximum search window size exceeded'): narrow date ranges if you hit it.",
  "Date filters take yyyy-MM-dd and cover the full day in CET/CEST.",
]
query = [
  { name = "voucherType", type = "csv", default = "any", open_enum = true, values = ["any", "salesinvoice", "salescreditnote", "purchaseinvoice", "purchasecreditnote", "invoice", "downpaymentinvoice", "creditnote", "orderconfirmation", "quotation", "deliverynote"], description = "Comma-separated voucher types, or any." },
  { name = "voucherStatus", type = "csv", default = "any", open_enum = true, values = ["any", "draft", "open", "overdue", "paid", "paidoff", "voided", "transferred", "sepadebit", "accepted", "rejected", "unchecked"], description = "Comma-separated voucher states, or any." },
  { name = "archived", type = "boolean", description = "Only archived (true) or non-archived (false) vouchers." },
  { name = "contactId", type = "uuid", description = "Only vouchers of this contact." },
  { name = "voucherDateFrom", type = "date", description = "Voucher date from (yyyy-MM-dd, inclusive)." },
  { name = "voucherDateTo", type = "date", description = "Voucher date to (yyyy-MM-dd, inclusive)." },
  { name = "createdDateFrom", type = "date", description = "Created date from (yyyy-MM-dd, inclusive)." },
  { name = "createdDateTo", type = "date", description = "Created date to (yyyy-MM-dd, inclusive)." },
  { name = "updatedDateFrom", type = "date", description = "Updated date from (yyyy-MM-dd, inclusive)." },
  { name = "updatedDateTo", type = "date", description = "Updated date to (yyyy-MM-dd, inclusive)." },
  { name = "voucherNumber", type = "string", html_encode = true, description = "Exact voucher number." },
]

