method = "PUT"
path = "/v1/invoices/{id}/interaction-status"
summary = "Set the interaction status of an invoice to accepted or rejected"
docs = "invoices-endpoint-interaction-status-of-an-invoice-update-an-invoice-interaction-status"
access = "partner"
scopes = ["invoices.read"]
body = "json"
merge_from = "invoices.get-interaction-status"
notes = ["Body: {\"status\": \"accepted\"|\"rejected\", \"version\": <current>}."]

