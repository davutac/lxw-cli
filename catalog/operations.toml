notes = [
  "Body: {\"eventType\": \"invoice.status.changed\", \"callbackUrl\": \"https://...\"}. Lexware sends a HEAD request to check the TLS certificate (Grade A required); failure returns 406.",
  "Event types: article|contact|credit-note|delivery-note|down-payment-invoice|dunning|invoice|order-confirmation|quotation|recurring-template|voucher + .created/.changed/.deleted, *.status.changed (not for article/contact/dunning/recurring-template), payment.changed, token.revoked.",
  "Callbacks are POSTed with header X-Lxo-Signature (base64 RSA-SHA512 over the body). Respond within 5 s with 2xx; 404/410 remove the subscription.",
]

