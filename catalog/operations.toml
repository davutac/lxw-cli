# Lexware API operation catalog.
#
# This file is the single source of truth for the CLI: every entry becomes a
# `lxw <resource> <action>` command, shows up in `lxw cli search`, and is
# rendered by `lxw schema <resource> <action>`. Field references and examples are looked up
# in catalog/docs.json by the `docs` / `schema` section anchors.
#
# access   = "public"  -> available with a personal API key (Public API)
#            "partner" -> documented only for the Partner API (OAuth2, partner contract);
#            operations inherit `access` from their resource
# max_page_size -> marks a paged list endpoint
# upload   = file limits per `type` form value (multipart operations)
# lock_field = optimistic-locking body field of PUT operations (default "version")
# quota    = "outgoing-vouchers": creates/sends an outgoing voucher; Lexware's Fair Usage
#            Policy allows at most 20 per minute, enforced across processes
# body     = "none" | "json" | "json-array" | "multipart"
# response = "json" | "binary" | "empty"
# confirm  = reason shown when the operation needs --yes (irreversible / outward-facing)
# Query params: type = string | uuid | integer | boolean | date | enum | csv | flag
#   flag      -> presence sends `name=true`
#   html_encode -> value is HTML-escaped (&, <, >) before URL encoding (Lexware search quirk)
#   open_enum -> `values` are suggestions; other values are passed through

