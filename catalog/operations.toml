# ---------------------------------------------------------------------------
# Credit notes
# ---------------------------------------------------------------------------

[[operations]]
id = "credit-notes.create"
method = "POST"
path = "/v1/credit-notes"
quota = "outgoing-vouchers"
summary = "Create a credit note (draft by default; --finalize for status open)"
docs = "credit-notes-endpoint-create-a-credit-note"
scopes = ["credit-notes.write"]
body = "json"
keywords = ["pursue", "folgebeleg", "from invoice"]
notes = [
  "Use --preceding-sales-voucher-id <invoiceId> to pursue an invoice; a finalized related credit note is immediately paidoff and reduces the invoice's open amount.",
  "Required: voucherDate, address (contactId or name+countryCode), lineItems, totalPrice{currency}, taxConditions{taxType}.",
]
query = [
  { name = "finalize", type = "flag", description = "Create finalized (status open) instead of draft.", confirm = "Finalized credit notes get a voucher number, are legally binding and cannot be edited or deleted via the API." },
  { name = "precedingSalesVoucherId", type = "uuid", description = "Pursue: create from this preceding sales voucher (usually an invoice)." },
]

[[operations]]
id = "credit-notes.get"
method = "GET"
path = "/v1/credit-notes/{id}"
summary = "Retrieve a credit note"
docs = "credit-notes-endpoint-retrieve-a-credit-note"
scopes = ["credit-notes.read"]

[[operations]]
id = "credit-notes.download"
method = "GET"
path = "/v1/credit-notes/{id}/file"
summary = "Download the credit note document (PDF, or XRechnung XML)"
docs = "credit-notes-endpoint-download-a-credit-note-file"
scopes = ["credit-notes.read"]
response = "binary"
accept = ["*/*", "application/pdf", "application/xml"]
keywords = ["pdf", "file", "document", "xml", "xrechnung"]
notes = ["Only finalized vouchers have a document; drafts return 409."]

[[operations]]
id = "credit-notes.render-document"
method = "GET"
path = "/v1/credit-notes/{id}/document"
summary = "Render the credit note PDF and return its documentFileId"
docs = "credit-notes-endpoint-render-a-credit-note-document-pdf"
scopes = ["credit-notes.read"]
deprecated = "Use `credit-notes download` instead."

[[operations]]
id = "credit-notes.send-email"
method = "POST"
path = "/v1/credit-notes/{id}/sendmail"
quota = "outgoing-vouchers"
summary = "Send the credit note by email via Lexware"
docs = "credit-notes-endpoint-sending-a-credit-note-via-e-mail"
access = "partner"
scopes = ["credit-notes.write"]
body = "json"
keywords = ["email", "mail", "send", "versenden"]
confirm = "Sends an email to external recipients; this cannot be undone."
notes = ["Body: {\"recipients\": [\"a@b.de\"], \"subject\"?, \"message\"?, \"signature\"?, \"attachments\"?: [{id, fileName, fileExtension}]}. Attachments must be uploaded first with `files upload --type attachment`."]

