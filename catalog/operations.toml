summary = "Retrieve a financial account"
docs = "finance-endpoint-retrieve-a-financial-account"
scopes = ["finance.read"]

[[operations]]
id = "finance-accounts.create"
method = "POST"
path = "/v1/finance/accounts"
summary = "Create a financial account"
docs = "finance-endpoint-create-a-financial-account"
scopes = ["finance.write"]
body = "json"
notes = ["Required: type (GIRO|PAYMENT_PROVIDER), name, accountSystem, bankName, balance; iban+bic for GIRO."]

[[operations]]
id = "finance-accounts.update"
method = "PUT"
path = "/v1/finance/accounts/{id}"
summary = "Update a financial account (e.g. balance)"
docs = "finance-endpoint-update-a-financial-account"
scopes = ["finance.write"]
body = "json"
merge_from = "finance-accounts.get"
lock_field = "lockVersion"
notes = ["Uses lockVersion (not version) for optimistic locking. Lexware never updates the balance by itself."]

[[operations]]
id = "finance-accounts.delete"
method = "DELETE"
path = "/v1/finance/accounts/{id}"
summary = "Delete a financial account"
docs = "finance-endpoint-delete-a-financial-account"
scopes = ["finance.write"]
response = "empty"
confirm = "Permanently deletes the financial account."

[[operations]]
id = "finance-transactions.create"
method = "POST"
path = "/v1/finance/transactions"
summary = "Create up to 25 financial transactions"
docs = "finance-endpoint-create-financial-transactions"
scopes = ["finance.write"]
body = "json-array"
notes = [
  "Body is a JSON array. Each item: valueDate/bookingDate, purpose, amount, financialAccountId, externalReference (recommended for de-duplication).",
  "Update the account balance afterwards with `finance-accounts update`.",
]

[[operations]]
id = "finance-transactions.get"
method = "GET"
path = "/v1/finance/transactions/{id}"
summary = "Retrieve a financial transaction"
docs = "finance-endpoint-retrieve-a-financial-transaction"
scopes = ["finance.read"]

[[operations]]
id = "finance-transactions.delete"
method = "DELETE"
path = "/v1/finance/transactions/{id}"
summary = "Delete a financial transaction"
docs = "finance-endpoint-delete-a-financial-transaction"
scopes = ["finance.write"]
response = "empty"
confirm = "Permanently deletes the financial transaction."

[[operations]]
id = "finance-transactions.latest"
method = "GET"
path = "/v1/finance/transactions/latest-transaction"
summary = "Retrieve the latest transaction of a financial account"
docs = "finance-endpoint-retrieve-the-latest-financial-transaction"
scopes = ["finance.read"]
query = [
  { name = "financialAccountId", type = "uuid", required = true, description = "The financial account." },
]

[[operations]]
id = "finance-transactions.assignments"
method = "GET"
path = "/v1/finance/transactions/{id}/assignments"
summary = "List vouchers assigned to a financial transaction"
docs = "finance-endpoint-retrieve-assigned-vouchers-for-a-financial-transaction"
scopes = ["finance.read"]

# ---------------------------------------------------------------------------
# Partner API only: organization, integrations, assignment hints
# ---------------------------------------------------------------------------

[[operations]]
id = "organization.get"
method = "GET"
path = "/v1/organization"
summary = "Retrieve organization master data"
docs = "organization-endpoint-retrieve-organization-information"
scopes = ["organization.read"]

[[operations]]
id = "partner-integrations.get"
method = "GET"
path = "/v1/partner-integrations"
summary = "Retrieve partner integration data of this connection"
docs = "partner-integrations-endpoint-retrieve-partner-integrations-data"

[[operations]]
id = "partner-integrations.update"
method = "PUT"
path = "/v1/partner-integrations"
summary = "Update partner integration status"
docs = "partner-integrations-endpoint-update-partner-integration-data"
body = "json"
merge_from = "partner-integrations.get"

[[operations]]
id = "transaction-assignment-hints.create"
method = "POST"
path = "/v1/transaction-assignment-hint"
summary = "Create a transaction assignment hint for a voucher"
docs = "transaction-assignment-hint-endpoint-create-a-transaction-assignment-hint"
scopes = ["transaction-assignment-hint.write"]
body = "json"
notes = ["Body: {\"voucherId\": \"...\", \"externalReference\": \"...\"} or with endToEndId."]
