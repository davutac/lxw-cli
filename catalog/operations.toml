# ---------------------------------------------------------------------------
# Invoices
# ---------------------------------------------------------------------------

[[operations]]
id = "invoices.create"
method = "POST"
path = "/v1/invoices"
quota = "outgoing-vouchers"
summary = "Create an invoice (draft by default; --finalize for status open)"
docs = "invoices-endpoint-create-an-invoice"
scopes = ["invoices.write"]
body = "json"
keywords = ["pursue", "folgebeleg", "from quotation", "bill", "xrechnung"]
notes = [
  "Required: voucherDate, address (contactId, or name+countryCode), lineItems, totalPrice{currency}, taxConditions{taxType}, shippingConditions{shippingType}.",
  "A referenced contact (address.contactId) must have exactly one billing address, otherwise 406; add one with `contacts update <id> --merge --set 'addresses.billing=[{\"street\":\"...\",\"zip\":\"...\",\"city\":\"...\",\"countryCode\":\"DE\"}]'`.",
  "Line item types: custom, material, service (reference an article id), text. Max 300 line items. Dates must look like 2026-01-31T00:00:00.000+01:00.",
  "The status cannot be changed via the API later; drafts can be finalized only in the Lexware web app.",
]
query = [
  { name = "finalize", type = "flag", description = "Create finalized (status open) instead of draft.", confirm = "Finalized invoices get an invoice number, are legally binding (GoBD) and cannot be edited or deleted via the API." },
  { name = "precedingSalesVoucherId", type = "uuid", description = "Pursue: create from this preceding sales voucher (quotation, order confirmation, ...)." },
]

[[operations]]
id = "invoices.get"
method = "GET"
path = "/v1/invoices/{id}"
summary = "Retrieve an invoice (also closing invoices)"
docs = "invoices-endpoint-retrieve-an-invoice"
scopes = ["invoices.read"]

[[operations]]
id = "invoices.download"
method = "GET"
path = "/v1/invoices/{id}/file"
summary = "Download the invoice document (PDF, or XRechnung XML)"
docs = "invoices-endpoint-download-an-invoice-file"
scopes = ["invoices.read"]
response = "binary"
accept = ["*/*", "application/pdf", "application/xml"]
keywords = ["pdf", "file", "document", "xml", "xrechnung", "e-invoice"]
notes = [
  "Only finalized invoices have a document; drafts return 409.",
  "XRechnung invoices default to XML with */*; pass --accept application/pdf for the (non-binding) PDF preview.",
]

[[operations]]
id = "invoices.render-document"
method = "GET"
path = "/v1/invoices/{id}/document"
summary = "Render the invoice PDF and return its documentFileId"
docs = "invoices-endpoint-render-an-invoice-document-pdf"
scopes = ["invoices.read"]
deprecated = "Use `invoices download` instead."

[[operations]]
id = "invoices.send-email"
method = "POST"
path = "/v1/invoices/{id}/sendmail"
quota = "outgoing-vouchers"
summary = "Send the invoice by email via Lexware"
docs = "invoices-endpoint-sending-an-invoice-via-e-mail"
access = "partner"
scopes = ["invoices.write"]
body = "json"
keywords = ["email", "mail", "send", "versenden"]
confirm = "Sends an email to external recipients; this cannot be undone."
notes = [
  "Body: {\"recipients\": [\"a@b.de\"], \"subject\"?, \"message\"?, \"signature\"?, \"attachments\"?: [{id, fileName, fileExtension}]}.",
  "Include \\n\\n{sharedLink}\\n in message to add the 'Beleglink teilen' link. Mailing has an extra rate limit (429).",
]

[[operations]]
id = "invoices.get-interaction-status"
method = "GET"
path = "/v1/invoices/{id}/interaction-status"
summary = "Retrieve the interaction status of an invoice (cross-system integrations)"
docs = "invoices-endpoint-interaction-status-of-an-invoice-retrieve-an-invoice-interaction-status"
access = "partner"
scopes = ["invoices.read"]

[[operations]]
