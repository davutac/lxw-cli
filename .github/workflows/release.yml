name: Release

# Pushing a tag like v0.1.0 (matching Cargo.toml's version) tests, builds and
# publishes a GitHub release. Running it manually builds without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { name: lxw-linux-amd64, os: ubuntu-24.04, arch: amd64 }
          - { name: lxw-linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }
          - { name: lxw-macos-amd64, os: macos-26, target: x86_64-apple-darwin }
          - { name: lxw-macos-arm64, os: macos-26, target: aarch64-apple-darwin }
          - { name: lxw-windows-amd64.exe, os: windows-2025, target: x86_64-pc-windows-msvc, ext: .exe }
          - { name: lxw-windows-arm64.exe, os: windows-2025, target: aarch64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - name: Build static Linux binary
        if: runner.os == 'Linux'
        run: scripts/build-linux.sh ${{ matrix.arch }}
      - name: Build macOS or Windows binary
        if: runner.os != 'Linux'
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lxw${{ matrix.ext }} dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8 # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum lxw-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes lxw-* SHA256SUMS

  packages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          ref: main
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          scripts/update-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS"
          git add Formula
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update Homebrew formula to $GITHUB_REF_NAME"
            git push origin main
          fi

  install:
    needs: packages
    uses: ./.github/workflows/install.yml
    with:
      ref: main
